<div class="auth-page">
    <div class="auth-card">
      <h1 class="auth-title">Login</h1>
  
      <div class="input-group">
        <label>Username</label>
        <input
          type="username"
          placeholder="Username"
          [(ngModel)]="loginRequest.username"
        />
      </div>
  
      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          placeholder="••••••••••"
          [(ngModel)]="loginRequest.password"
        />
      </div>
  
      <p *ngIf="errorMessage" class="error-text">
        {{ errorMessage }}
      </p>
  
      <button class="btn-primary" (click)="login()">Login</button>
  
      <button class="btn-link" (click)="router.navigateByUrl('register')">
        Register
      </button>
    </div>
  </div>
