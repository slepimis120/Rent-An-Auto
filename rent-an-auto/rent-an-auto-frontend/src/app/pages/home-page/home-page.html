<div class="header">
  <div class="logo" (click)="home()">🚗 RentAnAuto</div>

  <div class="header-actions">
    <button title="History" (click)="history()">📜</button>
    <button title="Active rentals" (click)="activeReservations()">🚘</button>
    <button class="logout" (click)="logout()">Logout</button>
  </div>
</div>

<div class="filter-panel">
  <input placeholder="Search (BMW, Audi...)" (input)="search$.next($any($event.target).value)" />

  <input placeholder="City" (input)="city$.next($any($event.target).value)" />

  <input placeholder="Brand" (input)="brand$.next($any($event.target).value)" />

  <select (change)="ordering$.next($any($event.target).value)">
    <option value="">Sort</option>
    <option value="price_per_day">Price ↑</option>
    <option value="-price_per_day">Price ↓</option>
    <option value="year">Year ↑</option>
    <option value="-year">Year ↓</option>
  </select>

  <input type="date" (change)="startDate$.next($any($event.target).value)" />
  <input type="date" (change)="endDate$.next($any($event.target).value)" />
</div>

<div class="vehicles-grid">
  <div class="vehicle-card" *ngFor="let v of filteredVehicles$ | async">
    <h3>{{ v.brand }} {{ v.model }}</h3>

    <p><strong>City:</strong> {{ v.city }}</p>
    <p><strong>Year:</strong> {{ v.year }}</p>
    <p class="price">{{ v.price_per_day }} € / day</p>

    <button class="reserve-btn" (click)="openPayment(v)">Reserve</button>
  </div>
</div>

<!-- PAYMENT MODAL -->
<div class="modal-backdrop" *ngIf="showPaymentModal">
  <div class="payment-modal">
    <h3>Choose payment method</h3>

    @if (availablePaymentMethods.includes('CARD')) {
      <button (click)="pay('CARD')">
        💳 Pay by Card
      </button>
    }

    @if (availablePaymentMethods.includes('QR_CODE')) {
      <button (click)="pay('QR')">
        📱 Pay with QR
      </button>
    }

    <button class="close" (click)="closePayment()">Cancel</button>
  </div>
</div>
