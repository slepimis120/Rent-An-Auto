<div class="container" *ngIf="transactionData">
  <h1>Sigurno plaćanje karticom</h1>

  <div class="amount-box">
    <label>Iznos za uplatu</label>
    <div class="price">{{ transactionData.amount | currency: transactionData.currency }}</div>
    <small style="color: #6b7280;">ID: {{ transactionData.id }}</small>
  </div>

  <div class="card-logos">
    <img src="/assets/visa.png" alt="Visa">
    <img src="/assets/mastercard.png" alt="Mastercard">
    <img src="/assets/maestro.png" alt="Maestro">
  </div>

  <form #paymentForm="ngForm" (ngSubmit)="submitPayment()">
    <div class="form-group">
      <label>Ime na kartici</label>
      <input type="text" name="holder" [(ngModel)]="paymentData.cardHolderName"
             placeholder="IME I PREZIME" required>
    </div>

    <div class="form-group">
      <label>Broj kartice (PAN)</label>
      <input type="text" name="pan" [(ngModel)]="paymentData.pan"
             placeholder="0000 0000 0000 0000" (input)="onPanInput($event)" maxlength="19" required>
      <small class="error" *ngIf="panInvalid">Neispravan broj kartice</small>
    </div>

    <div class="row">
      <div class="form-group col">
        <label>Važi do</label>
        <input type="text" name="expiry" [(ngModel)]="paymentData.expiryDate"
               placeholder="MM/YY" maxlength="5" (input)="onExpiryInput($event)" required>
      </div>
      <div class="form-group col">
        <label>CVV</label>
        <input type="password" name="cvv" [(ngModel)]="paymentData.securityCode"
               placeholder="***" maxlength="3" required>
      </div>
    </div>

    <div class="timer-box" [class.expired]="timeExpired">
      <span *ngIf="!timeExpired">Sesija ističe za: <strong>{{ timeLeft }}</strong></span>
      <span *ngIf="timeExpired">Sesija je istekla!</span>
    </div>

    <button class="save-btn" type="submit"
            [disabled]="timeExpired || panInvalid || paymentForm.invalid">
      Potvrdi plaćanje
    </button>
  </form>
</div>
