<div class="container" *ngIf="!loading && transaction && pspData">

  <div [ngSwitch]="pspData.method">

    <div *ngSwitchCase="'CARD'">
      <app-card-payment
        [transactionData]="transaction">
      </app-card-payment>
    </div>

    <div *ngSwitchCase="'QR_CODE'">
      <h3>QR Payment</h3>
      <p>Scan to pay {{ transaction.amount }} {{ transaction.currency }}</p>
    </div>

    <div *ngSwitchDefault>
      <p>Method {{ pspData.method }} is not supported yet.</p>
    </div>
  </div>

</div>

<div class="container" *ngIf="loading">
  <p>Loading payment details...</p>
</div>
<div class="container" *ngIf="errorMessage">
  <p class="error">{{ errorMessage }}</p>
</div>
