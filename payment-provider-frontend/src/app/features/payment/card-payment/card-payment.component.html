<div class="container" *ngIf="transaction">
  <h1>Payment Details</h1>

  <div class="amount-box">
    <label>Amount to Pay</label>
    <div class="price">{{ transaction.amount | currency: transaction.currency }}</div>
    <small>Transaction ID: {{ transaction.id }}</small>
  </div>

  <div class="card-logos">
    <img src="assets/visa.png" alt="Visa">
    <img src="assets/mastercard.png" alt="Mastercard">
    <img src="assets/maestro.png" alt="Maestro">
  </div>

  <form #paymentForm="ngForm" (ngSubmit)="submitPayment()">
    <div class="form-group">
      <label>Cardholder Name</label>
      <input type="text" name="holder" [(ngModel)]="paymentData.cardHolderName" placeholder="JOHN DOE" required>
    </div>

    <div class="form-group">
      <label>Card Number (PAN)</label>
      <input type="text" name="pan" [(ngModel)]="paymentData.pan" placeholder="0000 0000 0000 0000" (input)="validatePan()" required>
      <small class="error" *ngIf="panInvalid">Invalid card number (Luhn check failed)</small>
    </div>

    <div class="row">
      <div class="form-group col">
        <label>Expiry Date</label>
        <input type="text" name="expiry" [(ngModel)]="paymentData.expiryDate" placeholder="MM/YY" maxlength="5" required>
      </div>
      <div class="form-group col">
        <label>Security Code (CVV)</label>
        <input type="text" name="cvv" [(ngModel)]="paymentData.securityCode" placeholder="123" maxlength="3" required>
      </div>
    </div>

    <div class="timer-box" [class.expired]="timeExpired">
      Session expires in: {{ timeLeft }}
    </div>

    <button class="save-btn" type="submit" [disabled]="timeExpired || panInvalid || paymentForm.invalid">
      Confirm Payment
    </button>
  </form>
</div>
